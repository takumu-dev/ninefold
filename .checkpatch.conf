# Options for checkpatch.pl. The checkpatch target runs it from the
# repository root, where it reads this file, so local runs and CI agree.
#
# --strict stays off: its extra checks ask for kernel types such as u32,
# which a userspace library with a <stdint.h> API does not use.

# Check files on their own, not as part of a kernel source tree.
--no-tree

# One line per problem, tagged with its type, so that a failure is quick to
# read and the type is at hand for an --ignore.
--terse
--show-types

# Each .c and .h file starts with /* SPDX-License-Identifier: Zlib */.
# checkpatch wants the // form in .c files, the kernel's own habit; this
# project uses /* */ comments only.
--ignore SPDX_LICENSE_TAG

# The benchmark writes each value it reads to a volatile variable, so that
# the compiler keeps the work it times. checkpatch warns about any use of
# volatile.
--ignore VOLATILE
